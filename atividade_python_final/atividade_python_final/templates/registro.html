{% extends 'base.html' %}
{% block titulo %}Criar conta · Agenda{% endblock %}

{% block conteudo %}
<div class="estreito">
    <div class="cartao">
        <h1><i class="bi bi-person-plus"></i> Criar conta</h1>

        <form method="POST">
            <div class="campo">
                <label for="apelido">Como quer ser chamado</label>
                <input type="text" id="apelido" name="apelido" value="{{ apelido or '' }}" required autofocus>
            </div>
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" value="{{ email or '' }}" required>
            </div>
            <div class="campo">
                <label for="segredo">Senha <span class="dica">mínimo 6 caracteres</span></label>
                <input type="password" id="segredo" name="segredo" required>
            </div>
            <button type="submit" class="botao w-100">Criar conta</button>
        </form>

        <p class="rodape-link">
            Já tem conta? <a href="{{ url_for('login') }}">Entrar</a>
        </p>
    </div>
</div>
{% endblock %}
