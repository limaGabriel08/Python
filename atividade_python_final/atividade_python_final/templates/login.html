{% extends 'base.html' %}
{% block titulo %}Entrar · Agenda{% endblock %}

{% block conteudo %}
<div class="estreito">
    <div class="cartao">
        <h1><i class="bi bi-box-arrow-in-right"></i> Entrar</h1>

        <form method="POST">
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" value="{{ email or '' }}" required autofocus>
            </div>
            <div class="campo">
                <label for="segredo">Senha</label>
                <input type="password" id="segredo" name="segredo" required>
            </div>
            <button type="submit" class="botao w-100">Entrar</button>
        </form>

        <p class="rodape-link">
            Ainda não tem conta? <a href="{{ url_for('registro') }}">Criar agora</a>
        </p>
    </div>
</div>
{% endblock %}
